spring.application.name=moteur-comptable
server.port=${PORT:8080}

# Local : base H2 en mémoire. Sur Render : SPRING_DATASOURCE_URL / USERNAME / PASSWORD (PostgreSQL).
spring.datasource.url=jdbc:h2:mem:moteur;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Prototype : Hibernate crée les tables. Version finale : scripts de migration.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Adresses autorisées à appeler l'API (front Vercel), séparées par des virgules.
moteur.cors.origines=${MOTEUR_CORS_ORIGINES:http://localhost:*,http://127.0.0.1:*}
moteur.donnees-demo=${MOTEUR_DONNEES_DEMO:true}
